site_name: Naren Cloud Architecture Lab
site_description: Practical AWS, Kubernetes, platform engineering, GitOps, observability, DevSecOps, and AI automation guides.
site_author: Narendranath Panda
site_url: https://blog.npanda.online/
repo_name: naren4b/nks
repo_url: https://github.com/naren4b/nks

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture.md
      - AWS Architecture: aws-architecture.md
      - Kubernetes & Cloud Native: kubernetes.md
  - Platform:
      - Overview: platform.md
      - GitOps & Delivery: gitops-delivery.md
      - SRE & Observability: observability.md
  - Security:
      - Overview: security.md
  - AI:
      - Overview: ai-automation.md
      - Confidential AI: nitro-enclave-model-attestation.md
  - Miscellaneous:
      - Overview: miscellaneous.md
      - Linux & Talos: linux/index.md
      - Data & Messaging: data-messaging.md
  - Articles: articles.md

theme:
  name: material
  language: en
  icon:
    logo: material/kubernetes
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - header.autohide
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

hooks:
  - hooks/article_index.py

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.mark
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github-alt
      link: https://github.com/naren4b
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/Narentwtr
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/narendranathpanda/

copyright: Copyright &copy; 2022&ndash;2026 Narendranath Panda
