# Generic non-HA local learning baseline, no GitLab-specific configuration.
# Pinned to argo-cd Helm chart 10.15.0 (Argo CD application v3.6.1).
# Review upstream chart release and image before upgrading.
global:
  domain: localhost
server:
  service:
    type: ClusterIP
  ingress:
    enabled: false
configs:
  params:
    server.insecure: false
  cm:
    admin.enabled: true
    users.anonymous.enabled: false
    # Lab account, created without credentials. Set password interactively
    # using the Argo CD CLI after first-login admin initialization.
    accounts.learner: login
  rbac:
    policy.default: role:readonly
    policy.csv: |
      # Example limited operator: get/sync applications in default AppProject.
      p, role:lab-operator, applications, get, default/*, allow
      p, role:lab-operator, applications, sync, default/*, allow
      g, learner, role:lab-operator
